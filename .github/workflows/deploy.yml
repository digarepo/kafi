name: Deploy Kafi Monorepo

# Reusable incremental deployment. Called by deploy-staging.yml (dev pushes)
# and deploy-production.yml (main pushes) with environment-specific remote
# directories and public API URL. Only apps affected since the last
# successful deploy of THIS environment are built, uploaded, installed, and
# restarted; state is tracked per environment on the server.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: Deployment environment name (staging | production)
      web_dir:
        required: true
        type: string
        description: Remote directory for the public site
      admin_dir:
        required: true
        type: string
        description: Remote directory for the admin app
      api_dir:
        required: true
        type: string
        description: Remote directory for the API app
      api_url:
        required: true
        type: string
        description: Public API URL baked into the frontend builds
      enable_analytics:
        required: true
        type: boolean
        description: Whether to include the GA4 measurement id in the web build

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------------
      # 1. Determine which deployable apps changed since the last deploy
      #    of this environment
      # ---------------------------------------------------------------
      - name: Read last deployed SHA
        id: last-sha
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.CPANEL_HOST }} >> ~/.ssh/known_hosts
          LAST_SHA=$(ssh ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            'cat ~/deploy-state/last-sha-${{ inputs.environment }} 2>/dev/null || true')
          if [ -z "$LAST_SHA" ] || ! git merge-base --is-ancestor "$LAST_SHA" HEAD 2>/dev/null; then
            echo "No usable last-deploy SHA; doing a full deploy"
            LAST_SHA=""
            echo "full_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "full_deploy=false" >> "$GITHUB_OUTPUT"
          fi
          echo "last_sha=$LAST_SHA" >> "$GITHUB_OUTPUT"
          echo "Base for affected check: $LAST_SHA"

      - name: Detect affected apps
        id: affected
        run: |
          if [ "${{ steps.last-sha.outputs.full_deploy }}" = "true" ]; then
            AFFECTED="@kafi/web @kafi/admin @kafi/api"
          else
            AFFECTED=$(npx nx show projects --affected --base=${{ steps.last-sha.outputs.last_sha }} --head=HEAD 2>/dev/null || echo "@kafi/web @kafi/admin @kafi/api @kafi/database @kafi/ui")
          fi
          echo "Affected projects: $AFFECTED"
          echo "web=$(echo "$AFFECTED" | grep -qE '@kafi/(web|ui)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "admin=$(echo "$AFFECTED" | grep -qE '@kafi/(admin|ui)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "api=$(echo "$AFFECTED" | grep -qE '@kafi/(api|database)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Write frontend production env files
        run: |
          echo "VITE_API_URL=${{ inputs.api_url }}" > apps/web/.env.production
          if [ "${{ inputs.enable_analytics }}" = "true" ]; then
            echo "VITE_GA4_MEASUREMENT_ID=G-CZGQTYBLBZ" >> apps/web/.env.production
          fi
          echo "VITE_API_URL=${{ inputs.api_url }}" > apps/admin/.env.production

      # ---------------------------------------------------------------
      # 2. Build only the affected projects (Nx cache enabled)
      # ---------------------------------------------------------------
      - name: Build affected projects
        run: |
          if [ "${{ steps.last-sha.outputs.full_deploy }}" = "true" ]; then
            npx nx run-many -t build
          else
            npx nx affected -t build --base=${{ steps.last-sha.outputs.last_sha }} --head=HEAD
          fi

      # ---------------------------------------------------------------
      # 3. Package each affected app into a single tarball
      # ---------------------------------------------------------------
      - name: Package web
        if: steps.affected.outputs.web == 'true'
        run: |
          npm pack ./packages/ui
          mkdir -p deploy/web
          UI_PACKAGE=$(ls kafi-ui-*.tgz)
          cp apps/web/package.json deploy/web/
          cp "$UI_PACKAGE" deploy/web/
          node deployment/prepare-package-json.mjs deploy/web/package.json "$UI_PACKAGE"
          cp deployment/react-router/server.js deploy/web/
          cp deployment/react-router/start.cjs deploy/web/
          cp -R apps/web/build deploy/web/
          cp -R apps/web/public deploy/web/
          mkdir deploy/web/tmp
          NEW_HASH=$(cat deploy/web/package.json deploy/web/kafi-*.tgz | sha256sum | cut -d' ' -f1)
          OLD_HASH=$(ssh ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            'cat ~/${{ inputs.web_dir }}/.installed-package-sha 2>/dev/null || echo none')
          if [ "$NEW_HASH" != "$OLD_HASH" ]; then
            echo "Dependency set changed; bundling node_modules in CI"
            (cd deploy/web && npm install --omit=dev --no-audit --no-fund && echo "$NEW_HASH" > DEP_HASH)
            test -d deploy/web/node_modules/@kafi/ui
          else
            echo "Dependencies unchanged; shipping code only"
          fi
          tar -czf deploy-web.tar.gz -C deploy web
          test -f deploy/web/build/server/index.js

      - name: Package admin
        if: steps.affected.outputs.admin == 'true'
        run: |
          test -f kafi-ui-1.0.0.tgz || npm pack ./packages/ui
          mkdir -p deploy/admin
          UI_PACKAGE=$(ls kafi-ui-*.tgz)
          cp apps/admin/package.json deploy/admin/
          cp "$UI_PACKAGE" deploy/admin/
          node deployment/prepare-package-json.mjs deploy/admin/package.json "$UI_PACKAGE"
          cp deployment/react-router/server.js deploy/admin/
          cp deployment/react-router/start.cjs deploy/admin/
          cp -R apps/admin/build deploy/admin/
          cp -R apps/admin/public deploy/admin/
          mkdir deploy/admin/tmp
          NEW_HASH=$(cat deploy/admin/package.json deploy/admin/kafi-*.tgz | sha256sum | cut -d' ' -f1)
          OLD_HASH=$(ssh ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            'cat ~/${{ inputs.admin_dir }}/.installed-package-sha 2>/dev/null || echo none')
          if [ "$NEW_HASH" != "$OLD_HASH" ]; then
            echo "Dependency set changed; bundling node_modules in CI"
            (cd deploy/admin && npm install --omit=dev --no-audit --no-fund && echo "$NEW_HASH" > DEP_HASH)
            test -d deploy/admin/node_modules/@kafi/ui
          else
            echo "Dependencies unchanged; shipping code only"
          fi
          tar -czf deploy-admin.tar.gz -C deploy admin
          test -f deploy/admin/build/server/index.js

      - name: Package api
        if: steps.affected.outputs.api == 'true'
        run: |
          npm pack ./database
          mkdir -p deploy/api
          cp apps/api/package.json deploy/api/
          DATABASE_PACKAGE=$(ls kafi-database-*.tgz)
          cp "$DATABASE_PACKAGE" deploy/api/
          cp deployment/api/start.cjs deploy/api/
          cp -R apps/api/dist deploy/api/
          node deployment/prepare-package-json.mjs deploy/api/package.json "$DATABASE_PACKAGE" database
          mkdir deploy/api/tmp
          NEW_HASH=$(cat deploy/api/package.json deploy/api/kafi-*.tgz | sha256sum | cut -d' ' -f1)
          OLD_HASH=$(ssh ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            'cat ~/${{ inputs.api_dir }}/.installed-package-sha 2>/dev/null || echo none')
          if [ "$NEW_HASH" != "$OLD_HASH" ]; then
            echo "Dependency set changed; bundling node_modules in CI"
            (cd deploy/api && npm install --omit=dev --no-audit --no-fund && echo "$NEW_HASH" > DEP_HASH)
            test -d deploy/api/node_modules/@kafi/database
            test -d deploy/api/node_modules/@nestjs/core
          else
            echo "Dependencies unchanged; shipping code only"
          fi
          tar -czf deploy-api.tar.gz -C deploy api
          test -f deploy/api/dist/main.js

      # ---------------------------------------------------------------
      # 4. Upload one tarball per changed app, extract, install (only when
      #    package.json or the bundled workspace package changed), and
      #    restart Passenger
      # ---------------------------------------------------------------
      - name: Upload web
        if: steps.affected.outputs.web == 'true'
        run: |
          scp deploy-web.tar.gz ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ inputs.web_dir }}/deploy-web.tar.gz

      - name: Upload admin
        if: steps.affected.outputs.admin == 'true'
        run: |
          scp deploy-admin.tar.gz ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ inputs.admin_dir }}/deploy-admin.tar.gz

      - name: Upload api
        if: steps.affected.outputs.api == 'true'
        run: |
          scp deploy-api.tar.gz ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ inputs.api_dir }}/deploy-api.tar.gz

      - name: Apply web on server
        if: steps.affected.outputs.web == 'true'
        run: |
          ssh ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} << 'EOF'
          set -e
          export CI=true
          cd ~/${{ inputs.web_dir }}
          tar -xzf deploy-web.tar.gz --strip-components=1
          rm -f deploy-web.tar.gz package-lock.json build/client/index.html
          if [ -f DEP_HASH ]; then
            test -d node_modules/@kafi/ui
            mv DEP_HASH .installed-package-sha
            echo "Dependencies updated from CI bundle"
          fi
          touch tmp/restart.txt
          EOF

      - name: Apply admin on server
        if: steps.affected.outputs.admin == 'true'
        run: |
          ssh ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} << 'EOF'
          set -e
          export CI=true
          cd ~/${{ inputs.admin_dir }}
          tar -xzf deploy-admin.tar.gz --strip-components=1
          rm -f deploy-admin.tar.gz package-lock.json
          if [ -f DEP_HASH ]; then
            test -d node_modules/@kafi/ui
            mv DEP_HASH .installed-package-sha
            echo "Dependencies updated from CI bundle"
          fi
          touch tmp/restart.txt
          EOF

      - name: Apply api on server
        if: steps.affected.outputs.api == 'true'
        run: |
          ssh ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} << 'EOF'
          set -e
          export CI=true
          cd ~/${{ inputs.api_dir }}
          tar -xzf deploy-api.tar.gz --strip-components=1
          rm -f deploy-api.tar.gz package-lock.json
          if [ -f DEP_HASH ]; then
            test -d node_modules/@kafi/database
            test -d node_modules/@nestjs/core
            mv DEP_HASH .installed-package-sha
            echo "Dependencies updated from CI bundle"
          fi
          mkdir -p ~/storage/documents
          touch tmp/restart.txt
          EOF

      # ---------------------------------------------------------------
      # 5. Record the deployed SHA only after every enabled step succeeded
      # ---------------------------------------------------------------
      - name: Record deployed SHA
        run: |
          ssh ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            "mkdir -p ~/deploy-state && echo ${{ github.sha }} > ~/deploy-state/last-sha-${{ inputs.environment }}"
          echo "Deployment complete (${{ inputs.environment }}) — ${{ github.sha }}"
